    </div>
    <div class="player-controls">
      <button class="ctrl" data-action="prev" title="上一首" aria-label="上一首"><svg class="ic"><use href="#i-prev"/></svg></button>
      <button class="ctrl ctrl--play" id="mainPlayBtn" data-action="toggle-play" title="播放/暂停" aria-label="播放或暂停"><svg class="ic"><use href="#i-play"/></svg></button>
      <button class="ctrl" data-action="next" title="下一首" aria-label="下一首"><svg class="ic"><use href="#i-next"/></svg></button>
    </div>
    <button class="player-cover" id="playerCover" data-action="open-fullscreen" title="打开全屏播放页" aria-label="打开全屏播放页"></button>
    <div class="player-meta">
      <span class="player-title" id="playerTitle"></span>
      <span class="player-artist" id="playerArtist"></span>
    </div>
    <div class="player-extra">
      <button class="ctrl" data-action="more" title="更多" aria-label="更多"><svg class="ic"><use href="#i-more"/></svg></button>
      <button class="ctrl" id="modeBtn" data-action="cycle-mode" title="列表循环" aria-label="切换播放模式"><svg class="ic"><use href="#i-repeat"/></svg></button>
      <button class="ctrl" id="likeBtn" data-action="toggle-like" title="收藏" aria-label="收藏当前歌曲"><svg class="ic"><use href="#i-heart"/></svg></button>
      <button class="ctrl" data-action="open-queue" title="播放队列" aria-label="播放队列"><svg class="ic"><use href="#i-list"/></svg></button>
      <div class="volume">
        <button class="ctrl" id="muteBtn" data-action="toggle-mute" title="静音" aria-label="静音"><svg class="ic"><use href="#i-volume"/></svg></button>
        <input type="range" id="volumeRange" min="0" max="100" value="72" aria-label="音量" />
      </div>
    </div>
  </footer>

  <!-- ========================== 全屏沉浸式播放页 ========================== -->
  <section class="fullscreen" id="fullscreen" aria-label="全屏播放页" hidden>
    <div class="fs-bg" id="fsBg"></div>
    <button class="fs-corner fs-corner--tl" data-action="close-fullscreen" title="收起" aria-label="收起全屏播放页">
      <svg class="ic"><use href="#i-chevron-down"/></svg>
    </button>
    <button class="fs-corner fs-corner--tr" data-action="toggle-zen" title="专注模式" aria-label="切换专注模式">
      <svg class="ic"><use href="#i-expand"/></svg>
    </button>

    <div class="fs-inner">
      <div class="fs-left">
        <div class="fs-cover" id="fsCover"></div>
        <div class="fs-song">
          <div style="min-width:0">
            <h2 id="fsTitle"></h2>
            <p id="fsSub"></p>
          </div>
          <div class="fs-song-actions">
            <button class="fs-icon" id="fsLikeBtn" data-action="toggle-like" title="收藏" aria-label="收藏"><svg class="ic"><use href="#i-heart"/></svg></button>
            <button class="fs-icon" data-action="more" title="更多" aria-label="更多"><svg class="ic"><use href="#i-more"/></svg></button>
          </div>
        </div>
        <div class="fs-progress">
          <input class="seek" type="range" id="seekRange" min="0" max="100" value="0" step="0.1" aria-label="播放进度" />
          <div class="fs-times">
            <span id="fsCur">0:00</span>
            <span class="fs-format" id="fsFormat">FLAC</span>
            <span id="fsDur">0:00</span>
          </div>
        </div>
        <div class="fs-controls">
          <button class="fs-ctrl" id="fsModeBtn" data-action="cycle-mode" title="列表循环" aria-label="切换播放模式"><svg class="ic"><use href="#i-repeat"/></svg></button>
          <button class="fs-ctrl" data-action="prev" title="上一首" aria-label="上一首"><svg class="ic"><use href="#i-prev"/></svg></button>
          <button class="fs-ctrl fs-ctrl--play" id="fsPlayBtn" data-action="toggle-play" title="播放/暂停" aria-label="播放或暂停"><svg class="ic"><use href="#i-play"/></svg></button>
          <button class="fs-ctrl" data-action="next" title="下一首" aria-label="下一首"><svg class="ic"><use href="#i-next"/></svg></button>
          <button class="fs-ctrl" id="fsMuteBtn" data-action="toggle-mute" title="静音" aria-label="静音"><svg class="ic"><use href="#i-volume"/></svg></button>
        </div>
      </div>

      <div class="fs-right">
        <div class="lyrics" id="lyrics"></div>
      </div>
    </div>

    <button class="fs-queue" data-action="open-queue" title="播放队列" aria-label="播放队列"><svg class="ic"><use href="#i-list"/></svg></button>
  </section>

  <!-- 播放队列 -->
  <div class="queue-scrim" id="queueScrim" data-action="close-queue" hidden></div>
  <aside class="queue" id="queue" aria-label="播放队列" hidden>
    <div class="queue-head">
      <h2>播放队列 <span class="num" id="queueCount" style="color:var(--text-3);font-size:12px"></span></h2>
      <button class="icon-pill" data-action="close-queue" aria-label="关闭队列"><svg class="ic"><use href="#i-close"/></svg></button>
    </div>
    <div class="queue-list" id="queueList"></div>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- 真实音频元素：数据源提供 file 字段时由它播放，否则走内置演示计时器 -->
  <audio id="audioEl" preload="metadata"></audio>
</div>

<!-- 数据层：清单文件（list.js / manifest.json）由 fetch 读取，绝不写死在 HTML 里 -->
<script src="data-source.js"></script>
<!-- 高级播放层：ID3 / LRC / 播放模式 -->
<script src="advanced-player.js"></script>

<script>
/* ==========================================================================
   10 / 曲库容器 —— 本文件里没有任何假专辑 / 假曲目 / 假歌词
   HTML 里只有一个空容器 #album-list，所有卡片由
   MusicDataSource.renderAlbums() 从真实数据动态创建。
   ========================================================================== */
function fmt(s){
  s = Math.max(0, Math.floor(Number(s) || 0));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

/* ==========================================================================
   11 / 状态 & 工具函数
   ========================================================================== */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon = (name, cls = 'ic') => `<svg class="${cls}"><use href="#i-${name}"/></svg>`;

const state = {
  view:'albums',            // albums | favorites | recent | artists | detail
  nav:'albums',
  albumId:null,
  queue:[],                 // 当前播放队列（track 数组）
  track:null,
  playing:false,            // 真实曲库：不自动播放
  progress:0,
  volume:72,
  muted:false,
  mode:'loop',              // loop | shuffle | single
  liked:new Set(),
  recent:[],                // 最近播放的 albumId
  search:'',
  sort:'default',           // default | name | count
  fullscreen:false,
  zen:false,
  queueOpen:false,
  theme:localStorage.getItem('fn-theme') || 'dark',
  collapsed:false,
  lyricSet:null,            // 由 .lrc 解析出的时间轴歌词，优先级最高（[[秒,文本],...]）
  lyricOffset:0,            // LRC [offset:±毫秒] 换算成秒
  lyricMeta:null,           // [ti:][ar:][al:] 等歌词元数据
  embeddedLyrics:null,      // MP3 内嵌 USLT（无时间轴，整段展示）
};

/* ---------------------------------------------------------------------------
   当前生效的曲库 LIB —— 所有渲染函数只读它。
   初始为空；bootLibrary() 拿到真实数据后由 applyLibrary() 整体替换。
   --------------------------------------------------------------------------- */
let LIB = { albums:[], tracklists:{}, lyricSets:[], fmt, source:'loading' };
let LIB_SOURCE = 'loading';
let LIB_ERROR = null;        // 加载失败时保存排查信息，供空状态展示
let usingRealAudio = false;          // true = 由 <audio> 驱动进度；false = 演示计时器
let lyricToken = 0, id3Token = 0, lastQueueRef = null;
const audioEl = $('#audioEl');

/* 高级播放层：以纯函数方式接入现有 UI（保留原有 state / render，不推翻） */
const AP = window.AdvancedPlayer;
const shuffleBag = new AP.ShuffleBag(0);

/* 资源 URL 已在 data-source.js 的 resolveAsset() 里统一处理（含中文编码）。
   这里一律传 local，让 AP.resolveAudioURL 原样透传，避免二次拼接导致乱码。 */
function audioHostOpts(){
  const c = (window.MusicDataSource && window.MusicDataSource.CONFIG) || {};
  return { owner:c.owner, repo:c.repo, branch:c.branch || 'main', host:'local' };
}

/* ID3 回填：异步、不阻塞起播；CDN 不可用 / 无标签时用文件名兜底 */
async function applyID3(track, url){
  if(!url) return;
  const token = ++id3Token;
  const tags = await AP.readID3(url);
  if(token !== id3Token || state.track !== track) return;   // 已切歌，丢弃过期结果
  if(!tags){
    const fb = AP.fallbackFromFilename(url);
    if(!track.title) track.title = fb.title;
    if(!track.artist || track.artist === '未知歌手') track.artist = fb.artist;
    if(!track.album) track.album = fb.album;
  } else {
    if(tags.title)  track.title  = tags.title;
    if(tags.artist) track.artist = tags.artist;
    if(tags.album)  track.album  = tags.album;
    if(tags.picture && track.cover) track.cover = Object.assign({}, track.cover, { url:tags.picture });
    if(tags.lyrics && !track.lrc){
      track.embeddedLyrics = tags.lyrics;
      state.embeddedLyrics = String(tags.lyrics).split(/\r?\n/).filter(Boolean);
    }
  }
  renderPlayer();
  renderFullscreen();
  if(state.queueOpen) renderQueue();
  if(state.view === 'detail') renderView();
  if(state.fullscreen) renderLyrics(true);
}

function seedStateFromLibrary(){
  state.liked = new Set();
  LIB.albums.forEach(a => (LIB.tracklists[a.id] || []).forEach(t => { if (t.liked) state.liked.add(t.id); }));
  const first = LIB.albums[0];
  state.queue = first ? (LIB.tracklists[first.id] || []).slice() : [];
  state.track = state.queue[0] || null;   // 真实曲库：首张专辑第一首，不自动播放
  state.progress = 0;
  state.playing = false;
}
seedStateFromLibrary();

let timer = null, toastTimer = null;

/* cover 既接受原来的 CSS 配方对象，也接受真实图片 URL（或 {url:'...'}）。
   图片加载失败时 onerror 移除自己，底层 CSS 封面无缝接管。 */
function coverHTML(cv, extraClass = ''){
  if(!cv) return '';
  if(typeof cv === 'string') cv = { url:cv, skin:'blue', c1:'#2a5fa8', c2:'#0a1730', ink:'#ffffff' };
  const style = `--c1:${cv.c1};--c2:${cv.c2};--ink:${cv.ink}`;
  const img = cv.url
    ? `<img class="cv__img" src="${esc(cv.url)}" alt="" loading="lazy" onerror="this.remove()">`
    : '';
  const text = cv.url ? '' : [
    cv.kicker ? `<span class="cv__kicker">${esc(cv.kicker)}</span>` : '',
    `<span class="cv__title">${esc(cv.title || '')}</span>`,
    cv.foot  ? `<span class="cv__foot">${esc(cv.foot)}</span>` : '',
    cv.extra ? `<span class="cv__extra">${esc(cv.extra)}</span>` : '',
  ].join('');
  return `<div class="cv cv--${cv.skin || 'blue'} ${cv.url ? 'cv--photo' : ''} ${extraClass}" style="${style}">
    <div class="cv__art"></div>${img}${text}
  </div>`;
}

function albumById(id){ return LIB.albums.find(a => a.id === id); }

/* ---------------------------------------------------------------------------
   滚动歌词 —— 解析与定位交给 advanced-player.js 的 parseLRC / activeIndex
   支持 [ti:][ar:][al:][offset:]、一行多时间戳、增强型逐字标签、二分查找。
   数据源可提供同名 .lrc（GitHub 自动模式按 01.mp3 ↔ 01.lrc 配对）。
   --------------------------------------------------------------------------- */
async function loadLyricsFor(t){
  const token = ++lyricToken;
  state.lyricSet = null;
  state.lyricOffset = 0;
  state.lyricMeta = null;
  state.embeddedLyrics = null;
  if(!t) return;
  const parsed = await AP.loadLRC(t.lrc);      // 跨域失败安静返回 null
  if(token !== lyricToken) return;            // 已切歌，丢弃过期结果
  if(parsed){
    state.lyricSet = parsed.toPairs();
    state.lyricOffset = parsed.offset;
    state.lyricMeta = parsed.meta;
  } else if(t.embeddedLyrics){
    /* MP3 内嵌 USLT 无时间轴：整段展示，不伪造逐行时间 */
    state.embeddedLyrics = String(t.embeddedLyrics).split(/\r?\n/).filter(Boolean);
  }
  if(state.fullscreen) renderLyrics(true);
}

const NO_LYRICS = [[0, '♪ 暂无歌词'], [0, '在专辑目录放置同名 .lrc 即可显示']];
const EMBED_HINT = [0, '♪ MP3 内嵌歌词（无时间轴）'];
function currentLyricSet(){
  if(!state.track) return NO_LYRICS;
  if(state.lyricSet && state.lyricSet.length) return state.lyricSet;
  if(state.embeddedLyrics && state.embeddedLyrics.length)
    return [EMBED_HINT, ...state.embeddedLyrics.map(line => [0, line])];
  return NO_LYRICS;                           // 没有 .lrc 时显示占位，绝不用演示歌词
}
function toast(msg){
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('is-show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('is-show'), 1900);
}

/* ==========================================================================
   12 / 渲染：主内容区 —— 以下三个入口全部由 LIB 驱动
       ① renderAlbumNav()  左侧专辑列表
       ② albumCardHTML()   中间专辑网格卡片
       ③ detailHTML()      专辑详情页歌曲表格
   ========================================================================== */

/* ① 左侧专辑列表：完全由当前数据源动态生成 */
function renderAlbumNav(){
  const ul = $('#playlistList');
  if(!ul) return;
  const count = $('#albumNavCount');
  if(count) count.textContent = '· ' + LIB.albums.length;
  if(!LIB.albums.length){ ul.innerHTML = '<li class="nav-empty">暂无专辑</li>'; return; }
  ul.innerHTML = LIB.albums.map(a => {
    const cv = a.cover || {};
    const bg = `background:linear-gradient(140deg,${cv.c1 || '#4d7fd6'},${cv.c2 || '#22304f'})`;
    const thumb = cv.url ? `<img src="${esc(cv.url)}" alt="" onerror="this.remove()">` : '';
    const active = (state.view === 'detail' && state.albumId === a.id) ? 'is-active' : '';
    return `<li><button class="playlist-item ${active}" data-action="open-album" data-id="${esc(a.id)}" title="${esc(a.title)}">
      <span class="pl-thumb" style="${bg}">${thumb}</span><span>${esc(a.title)}</span></button></li>`;
  }).join('');
}

/* 数据源状态标识 */
function updateSourceChip(source, detail, loading){
  const chip = $('#sourceChip');
  if(!chip) return;
  const map = { loading:['···','正在同步'], list:['LIST','清单文件'], github:['GITHUB','GitHub REST API'], empty:['EMPTY','未读到曲库'] };
  const [tag, name] = map[source] || map.empty;
  chip.dataset.source = source;
  chip.classList.toggle('is-loading', !!loading);
  chip.innerHTML = `<span class="src-dot"></span>${loading ? '正在同步曲库…' : tag + ' · ' + esc(name)}`;
  chip.title = '当前曲库：' + name + '\n' + (detail || '') + '\n点侧栏 ↻ 可重新同步';
}

function filteredAlbums(){
  let list = LIB.albums.slice();
  const q = state.search.trim().toLowerCase();
  if(q) list = list.filter(a => ((a.title || '') + (a.artist || '')).toLowerCase().includes(q));
  if(state.sort === 'name')  list.sort((a,b) => String(a.title).localeCompare(String(b.title),'zh-CN'));
  if(state.sort === 'count') list.sort((a,b) => b.count - a.count);
  return list;
}

/* 专辑卡片由 MusicDataSource.renderAlbums() 用 document.createElement 动态创建，
   本文件不再生成任何专辑 HTML。 */

function emptyHTML(title, desc){
  return `<div class="empty">${icon('empty')}<h3>${esc(title)}</h3><p>${esc(desc)}</p>
    <button class="ghost-btn" data-action="go-albums" style="margin-top:8px">去逛逛专辑 ${icon('next')}</button></div>`;
}

function renderView(){
  const root = $('#viewRoot');
  const back = $('#backBtn');
  back.hidden = state.view !== 'detail';
  if(!LIB.albums.length && state.view !== 'detail'){
    if(LIB_SOURCE === 'loading') window.MusicDataSource.renderLoading(root);
    else window.MusicDataSource.renderEmpty(root, LIB_ERROR);
    return;
  }

  if(state.view === 'detail'){ root.innerHTML = detailHTML(); bindDetail(); return; }

  const titles = { albums:['专辑','共 ' + LIB.albums.length + ' 张专辑'],
                   favorites:['收藏','你收藏的专辑'],
                   recent:['最近','最近播放过的专辑'],
                   artists:['歌手','按歌手浏览'] };
  const [title, sub] = titles[state.view];
  const sortLabel = state.sort === 'name' ? '按名称' : state.sort === 'count' ? '按歌曲数' : '默认排序';

  let body = '';
  let gridList = null;
  if(state.view === 'artists'){
    const map = new Map();
    LIB.albums.forEach(a => map.set(a.artist, (map.get(a.artist) || 0) + 1));
    const colors = [['#4d7fd6','#22304f'],['#c2604f','#5a241c'],['#5c8d6a','#243b2c'],['#8a6bb0','#3a2a52']];
    body = `<div class="artist-grid">${Array.from(map.entries()).map(([name,n],i) => `
      <div class="artist-card" data-action="filter-artist" data-name="${esc(name)}" style="--i:${i}" tabindex="0" role="button">
        <div class="artist-avatar" style="background:linear-gradient(145deg,${colors[i%4][0]},${colors[i%4][1]})">${esc(name.slice(0,1))}</div>
        <div class="artist-name">${esc(name)}</div>
        <div class="artist-count">${n} 张专辑</div>
      </div>`).join('')}</div>`;
  } else {
    let list = filteredAlbums();
    gridList = list;
    if(state.view === 'favorites') list = list.filter(a => (LIB.tracklists[a.id] || []).some(t => state.liked.has(t.id)));
    if(state.view === 'recent')   list = state.recent.map(albumById).filter(Boolean);
    body = list.length
      ? '<div id="album-list" class="album-grid"></div>'   /* 空容器，由 renderAlbums() 填充 */
      : emptyHTML(state.search ? '没有找到相关专辑' : (state.view === 'favorites' ? '还没有收藏' : '还没有播放记录'),
                  state.search ? `换个关键词试试，或清空搜索框。` : '点开一张专辑，播放或点一下红心，这里就会有内容。');
  }

  root.innerHTML = `
    <div class="page-head">
      <div><h1 class="page-title">${title}</h1><p class="page-sub">${sub}</p></div>
      <div class="head-actions">
        <button class="ghost-btn" data-action="cycle-sort" title="切换排序">${icon('sort')}${sortLabel}</button>
      </div>
    </div>${body}`;

  /* 真实数据 → 动态创建专辑卡片（document.createElement） */
  if(gridList && gridList.length){
    window.MusicDataSource.renderAlbums(gridList, $('#album-list'));
  }

  /* 网格卡片的键盘可达：Enter / Space 打开详情 */
  $$('.album-card, .artist-card', root).forEach(el => el.addEventListener('keydown', e => {
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); el.click(); }
  }));
}

function detailHTML(){
  const a = albumById(state.albumId);
  if(!a) return emptyHTML('专辑不存在','返回专辑列表重新选择。');
  const tracks = LIB.tracklists[a.id] || [];
  const metaLine = [a.artist, a.year ? a.year + ' 年发行' : '', a.count + ' 首歌'].filter(Boolean).join(' · ');
  return `
    <section class="detail-hero">
      <div class="detail-cover">${coverHTML(a.cover)}</div>
      <div class="detail-info">
        <p class="detail-eyebrow">专辑</p>
        <h1 class="detail-title">${esc(a.title)}</h1>
        <p class="detail-meta">${esc(metaLine)}</p>
        <div class="detail-actions">
          <button class="primary-btn" data-action="play-album" data-id="${esc(a.id)}">${icon('play')}播放全部</button>
          <button class="icon-pill" data-action="shuffle-album" data-id="${esc(a.id)}" title="随机播放" aria-label="随机播放">${icon('shuffle')}</button>
          <button class="icon-pill" data-action="download" title="下载" aria-label="下载">${icon('download')}</button>
          <button class="icon-pill" data-action="more" title="更多" aria-label="更多">${icon('more')}</button>
        </div>
      </div>
    </section>
    ${tracks.length ? `
    <section class="track-table" aria-label="歌曲列表">
      <div class="track-row is-head">
        <span class="track-no">#</span><span>歌曲</span><span class="col-album">专辑</span>
        <span class="t-center">收藏</span><span class="t-right">时长</span>
        <span class="t-right col-size">大小</span><span class="t-right col-format">格式</span>
      </div>
      ${tracks.map(t => trackRowHTML(t)).join('')}
    </section>` : emptyHTML('这张专辑还没有歌曲','在 GitHub 仓库的该专辑文件夹里放入音频文件后刷新即可。')}`;
}

function trackRowHTML(t){
  const cur = state.track && state.track.id === t.id;
  const on  = state.liked.has(t.id);
  return `<div class="track-row ${cur ? 'is-current':''}" data-action="play-track" data-id="${t.id}" data-album="${t.albumId}" tabindex="0" role="button" aria-label="播放 ${esc(t.title)}">
    <span class="track-no"><span class="num">${String(t.no).padStart(2,'0')}</span>${icon('play')}</span>
    <span class="track-main">
      <span class="track-thumb">${coverHTML(t.cover)}</span>
      <span class="track-text"><span class="track-name">${esc(t.title)}</span><span class="track-artist">${esc(t.artist)}</span></span>
    </span>
    <span class="col-album truncate">${esc(t.album)}</span>
    <span class="t-center"><button class="heart-btn ${on ? 'is-on':''}" data-action="toggle-like-track" data-id="${t.id}" title="${on ? '取消收藏':'收藏'}" aria-label="收藏">${icon('heart')}</button></span>
    <span class="t-right">${t.duration}</span>
    <span class="t-right col-size">${t.size}</span>
    <span class="t-right col-format"><span class="format-tag">${t.format}</span></span>
  </div>`;
}

function bindDetail(){
  $$('.track-row[data-action="play-track"]').forEach(el => el.addEventListener('keydown', e => {
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); el.click(); }
  }));
}

/* ==========================================================================
   13 / 渲染：播放栏 / 全屏页 / 队列
   ========================================================================== */
function renderPlayer(){
  const t = state.track;
  if(!t) return;
  $('#playerCover').innerHTML = coverHTML(t.cover);
  $('#playerTitle').textContent  = t.title;
  $('#playerArtist').textContent = t.artist;
  $('#playerTitle').title = t.title;

  const playIcon = state.playing ? 'pause' : 'play';
  $('#mainPlayBtn').innerHTML = icon(playIcon);
  $('#fsPlayBtn').innerHTML   = icon(playIcon);

  const modeIcons = { loop:'repeat', shuffle:'shuffle', single:'repeat1' };
  const modeNames = { loop:'列表循环', shuffle:'随机播放', single:'单曲循环' };
  ['#modeBtn','#fsModeBtn'].forEach(sel => {
    const b = $(sel);
    if(b){ b.innerHTML = icon(modeIcons[state.mode]); b.title = modeNames[state.mode]; }
  });

  const on = state.liked.has(t.id);
  [['#likeBtn','ctrl'],['#fsLikeBtn','fs-icon']].forEach(([sel,cls]) => {
    const b = $(sel);
    if(b){ b.classList.toggle('is-on', on); b.title = on ? '取消收藏' : '收藏'; }
  });

  const volIcon = (state.muted || state.volume === 0) ? 'mute' : 'volume';
  $('#muteBtn').innerHTML  = icon(volIcon);
  $('#fsMuteBtn').innerHTML = icon(volIcon);

  $('#fsFormat').textContent = t.format;
  $('#fsDur').textContent = t.duration;
  $('#seekRange').max = Math.max(1, t.sec || 1);
}

function renderFullscreen(){
  const t = state.track;
  if(!t) return;
  const cv = t.cover || { c1:'#2a2430', c2:'#141118' };
  $('#fsBg').style.background = `linear-gradient(135deg,${cv.c1 || '#2a2430'},${cv.c2 || '#141118'})`;
  $('#fsCover').innerHTML = coverHTML(t.cover);
  $('#fsTitle').textContent = t.title;
  $('#fsSub').textContent = `${t.artist} · ${t.album}`;
  renderLyrics(true);
}

function renderLyrics(force = false){
  const box = $('#lyrics');
  if(!box) return;
  const set = currentLyricSet();
  const key = String(state.track && state.track.id) + '|' + (state.lyricSet ? 'lrc' : '') + '|' + set.length;
  if(force || box.dataset.key !== key){
    box.dataset.key = key;
    box.innerHTML = set.map(([,text],i) =>
      `<div class="lyric-line ${set === NO_LYRICS && i > 0 ? 'lyric-hint' : ''}" data-i="${i}">${esc(text)}</div>`
    ).join('');
  }
  /* 二分定位当前行；LRC 的 [offset:] 在这里生效。
     占位文案 / 内嵌 USLT 没有时间轴，固定高亮首行，避免二分落到灰色提示行上。 */
  const offset = state.lyricSet ? (state.lyricOffset || 0) : 0;
  const isStaticLyrics = set === NO_LYRICS || set[0] === EMBED_HINT;
  const idx = isStaticLyrics ? 0 : Math.max(0, AP.activeIndex(set, state.progress, offset));
  $$('.lyric-line', box).forEach((el,i) => el.classList.toggle('is-active', i === idx));
  const lineH = window.innerWidth <= 860 ? 44 : 56;
  const viewport = $('.fs-right').clientHeight || 480;
  box.style.transform = `translateY(${viewport / 2 - (idx + .5) * lineH}px)`;
}

function renderQueue(){
  $('#queueCount').textContent = `· ${state.queue.length} 首`;
  $('#queueList').innerHTML = state.queue.map((t,i) => `
    <button class="queue-item ${state.track && state.track.id === t.id ? 'is-current':''}" data-action="play-queue" data-index="${i}">
      <span class="track-thumb">${coverHTML(t.cover)}</span>
      <span class="track-text"><span class="track-name">${esc(t.title)}</span><span class="track-artist">${esc(t.artist)}</span></span>
      <span class="queue-idx num">${String(i+1).padStart(2,'0')}</span>
    </button>`).join('');
}

function renderProgress(){
  const t = state.track;
  if(!t) return;
  const dur = t.sec || 1;
  const pct = Math.min(100, state.progress / dur * 100);
  $('#playerProgressFill').style.width = pct + '%';
  $('#fsCur').textContent = LIB.fmt(state.progress);
  const seek = $('#seekRange');
  if(document.activeElement !== seek) seek.value = Math.min(state.progress, dur);
}

/* ==========================================================================
   14 / 播放控制
   ========================================================================== */
function playAlbum(id, shuffle = false){
  const a = albumById(id);
  if(!a) return;
  let list = (LIB.tracklists[id] || []).slice();
  if(!list.length){ toast('这张专辑还没有歌曲'); return; }
  if(shuffle){
    const bag = new AP.ShuffleBag(list.length);
    list = Array.from({ length:list.length }, () => list[bag.next(-1)]);
  }
  state.queue = list;
  playTrack(list[0], true);
  state.recent = [id, ...state.recent.filter(x => x !== id)].slice(0, 8);
  toast(shuffle ? `随机播放《${a.title}》` : `正在播放《${a.title}》`);
  if(state.view !== 'detail') renderView();
  renderAlbumNav();
}

function playTrack(track, autoplay = true){
  if(!track) return;
  state.track = track;
  state.progress = 0;
  state.playing = autoplay;
  usingRealAudio = !!track.file;
  /* 队列变了才重置洗牌桶，保证「一轮内不重复」不被切歌打断 */
  if(lastQueueRef !== state.queue){
    lastQueueRef = state.queue;
    shuffleBag.setSize(state.queue.length);
    shuffleBag.reset();
  }
  const playURL = usingRealAudio ? AP.resolveAudioURL(track.file, audioHostOpts()) : '';

  if(usingRealAudio){
    /* 真实音频：进度交给 <audio> 的 timeupdate，时长由 loadedmetadata 回填 */
    audioEl.pause();
    audioEl.src = playURL;              // ← new Audio() / audio.src 的播放 URL
    audioEl.volume = state.muted ? 0 : state.volume / 100;
    audioEl.load();
    if(autoplay){
      audioEl.play().catch(() => {
        state.playing = false;
        renderPlayer();
        toast('浏览器阻止了自动播放，点一下播放按钮即可');
      });
    }
  } else {
    /* 该曲目没有真实音频地址时：只推进进度条计时，不产生任何假歌曲 */
    audioEl.pause();
    audioEl.removeAttribute('src');
  }

  loadLyricsFor(track);
  applyID3(track, playURL);             // 异步补 ID3，不阻塞起播
  renderPlayer();
  renderFullscreen();
  renderProgress();
  if(state.queueOpen) renderQueue();
  if(state.view === 'detail') renderView();
  renderAlbumNav();
  startTimer();
}

function startTimer(){
  clearInterval(timer);
  /* 演示用 4 倍速推进，便于在合理时间内看到歌词滚动与进度变化 */
  timer = setInterval(() => {
    if(!state.track) return;
    if(usingRealAudio){
      /* 真实音频的 state.progress 由 timeupdate 写入，这里只刷新歌词高亮 */
      if(state.fullscreen) renderLyrics();
      return;
    }
    if(!state.playing) return;
    state.progress += 1;
    const dur = state.track.sec || 240;
    if(state.progress >= dur){
      if(state.mode === 'single'){ state.progress = 0; }
      else { nextTrack(true); return; }
    }
    renderProgress();
    if(state.fullscreen) renderLyrics();
  }, 250);
}

function nextTrack(auto = false){
  if(!state.queue.length || !state.track) return;
  const cur = state.queue.findIndex(t => t.id === state.track.id);
  shuffleBag.setSize(state.queue.length);
  /* manual=true（用户点下一首）时，单曲循环也要切歌；自动播完则原地重播 */
  const r = AP.computeNextIndex(state.queue.length, cur, state.mode, shuffleBag, !auto);
  if(r.index < 0) return;
  if(r.replay){
    state.progress = 0;
    if(usingRealAudio){ audioEl.currentTime = 0; audioEl.play().catch(() => {}); }
    renderProgress();
    if(state.fullscreen) renderLyrics(true);
    return;
  }
  playTrack(state.queue[r.index], state.playing || auto);
}

function prevTrack(){
  if(!state.queue.length) return;
  if(state.progress > 5){
    state.progress = 0;
    if(usingRealAudio) audioEl.currentTime = 0;
    renderProgress();
    return;
  }
  let i = state.queue.findIndex(t => t.id === state.track.id);
  i = (i - 1 + state.queue.length) % state.queue.length;
  playTrack(state.queue[i], state.playing);
}

function togglePlay(){
  if(usingRealAudio){
    if(audioEl.paused){
      audioEl.play().catch(() => toast('音频尚未就绪，稍候再试'));
      state.playing = true;
    } else {
      audioEl.pause();
      state.playing = false;
    }
  } else {
    state.playing = !state.playing;
  }
  $('#mainPlayBtn').innerHTML = icon(state.playing ? 'pause' : 'play');
  $('#fsPlayBtn').innerHTML   = icon(state.playing ? 'pause' : 'play');
}

function cycleMode(){
  const order = AP.MODES;              // loop → shuffle → single
  state.mode = order[(order.indexOf(state.mode) + 1) % order.length];
  shuffleBag.setSize(state.queue.length);
  shuffleBag.reset();
  renderPlayer();
  toast(AP.MODE_LABEL[state.mode]);
}

function toggleLike(id){
  const tid = id || (state.track && state.track.id);
  if(!tid) return;
  if(state.liked.has(tid)){ state.liked.delete(tid); toast('已取消收藏'); }
  else { state.liked.add(tid); toast('已加入收藏'); }
  renderPlayer();
  if(state.view === 'detail') renderView();
}

function setVolume(v){
  state.volume = Number(v);
  state.muted = state.volume === 0;
  $('#volumeRange').value = state.volume;
  audioEl.volume = state.muted ? 0 : state.volume / 100;
  $('#muteBtn').innerHTML = icon(state.muted ? 'mute' : 'volume');
  $('#fsMuteBtn').innerHTML = icon(state.muted ? 'mute' : 'volume');
}

function openFullscreen(open){
  state.fullscreen = open;
  $('#fullscreen').hidden = !open;
  if(open){ renderFullscreen(); renderLyrics(true); renderProgress(); }
  document.body.style.overflow = open ? 'hidden' : '';
}

function openQueue(open){
  state.queueOpen = open;
  $('#queue').hidden = !open;
  $('#queueScrim').hidden = !open;
  if(open) renderQueue();
}

function setNav(nav){
  state.nav = nav;
  state.view = nav;
  $$('.nav-item').forEach(b => b.classList.toggle('is-active', b.dataset.nav === nav));
  renderView();
  $('#main').scrollTop = 0;
}

function setTheme(theme){
  state.theme = theme;
  document.documentElement.dataset.theme = theme;
  $('#themeIcon').querySelector('use').setAttribute('href', `#i-${theme === 'dark' ? 'sun' : 'moon'}`);
  localStorage.setItem('fn-theme', theme);
}

/* ==========================================================================
   15 / 事件（委托 + 局部监听）
   ========================================================================== */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  const id = el.dataset.id;

  switch(action){
    case 'open-album':
      state.albumId = id; state.view = 'detail';
      renderView(); renderAlbumNav(); $('#main').scrollTop = 0;
      break;
    case 'play-album':      playAlbum(id); break;
    case 'shuffle-album':   playAlbum(id, true); break;
    case 'play-track': {
      const list = LIB.tracklists[el.dataset.album] || [];
      const t = list.find(x => x.id === id);
      const al = albumById(el.dataset.album);
      if(t){ state.queue = list.slice(); playTrack(t, true);
             if(al) state.recent = [al.id, ...state.recent.filter(x => x !== al.id)].slice(0,8); }
      break;
    }
    case 'toggle-like-track': toggleLike(id); break;
    case 'toggle-like':     toggleLike(); break;
    case 'toggle-play':     togglePlay(); break;
    case 'prev':            prevTrack(); break;
    case 'next':            nextTrack(); break;
    case 'cycle-mode':      cycleMode(); break;
    case 'toggle-mute':
      state.muted = !state.muted;
      setVolume(state.muted ? 0 : (state.volume || 72));
      break;
    case 'open-fullscreen': openFullscreen(true); break;
    case 'close-fullscreen':openFullscreen(false); break;
    case 'toggle-zen':
      state.zen = !state.zen;
      $('#fullscreen').classList.toggle('is-zen', state.zen);
      toast(state.zen ? '专注模式' : '显示歌词');
      break;
    case 'open-queue':      openQueue(true); break;
    case 'close-queue':     openQueue(false); break;
    case 'play-queue': {
      const i = Number(el.dataset.index);
      playTrack(state.queue[i], true); openQueue(false);
      break;
    }
    case 'back':            setNav(state.nav); break;
    case 'go-albums':       state.search = ''; $('#searchInput').value = ''; setNav('albums'); break;
    case 'cycle-sort': {
      const order = ['default','name','count'];
      state.sort = order[(order.indexOf(state.sort) + 1) % 3];
      renderView();
      break;
    }
    case 'toggle-theme':    setTheme(state.theme === 'dark' ? 'light' : 'dark'); break;
    case 'toggle-sidebar': {
      state.collapsed = !state.collapsed;
      $('#app').classList.toggle('is-collapsed', state.collapsed);
      $('#collapseBtn').title = state.collapsed ? '展开侧边栏' : '收起侧边栏';
      $('#collapseBtn').querySelector('use').setAttribute('href', state.collapsed ? '#i-chevron-down' : '#i-chevron-up');
      break;
    }
    case 'filter-artist':
      state.search = el.dataset.name; $('#searchInput').value = el.dataset.name;
      setNav('albums');
      break;
    case 'play-playlist': {
      const first = LIB.albums[0];
      if(first) playAlbum(first.id);
      break;
    }
    case 'refresh-library': bootLibrary(true); break;
    case 'download':
      if(state.track && state.track.file){
        window.open(state.track.file, '_blank', 'noopener');
        toast('已在新标签打开音频文件');
      } else toast('已加入下载队列（演示）');
      break;
    case 'more':            toast('更多操作（演示）'); break;
    case 'user':            toast('你好，d'); break;
  }
});

/* 导航按钮单独绑定，避免与 data-action 委托冲突 */
$$('.nav-item').forEach(btn => btn.addEventListener('click', () => {
  state.search = ''; $('#searchInput').value = '';
  setNav(btn.dataset.nav);
}));

/* 搜索：只重建内容区，输入框保持焦点 */
$('#searchInput').addEventListener('input', (e) => {
  state.search = e.target.value;
  if(state.view === 'detail'){ state.view = state.nav; }
  renderView();
});

/* 进度跳转 */
function seekFromEvent(e, el){
  const r = el.getBoundingClientRect();
  const p = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  const dur = usingRealAudio && isFinite(audioEl.duration) ? audioEl.duration : (state.track.sec || 1);
  state.progress = p * dur;
  if(usingRealAudio) audioEl.currentTime = state.progress;
  renderProgress();
  if(state.fullscreen) renderLyrics();
}
$('#playerProgress').addEventListener('click', (e) => seekFromEvent(e, e.currentTarget));
$('#seekRange').addEventListener('input', (e) => {
  state.progress = Number(e.target.value);
  if(usingRealAudio) audioEl.currentTime = state.progress;
  $('#fsCur').textContent = LIB.fmt(state.progress);
  $('#playerProgressFill').style.width = (state.progress / (state.track.sec || 1) * 100) + '%';
  if(state.fullscreen) renderLyrics();
});
$('#volumeRange').addEventListener('input', (e) => setVolume(e.target.value));

/* 真实音频事件：进度 / 时长回填 / 切歌 / 出错提示 */
audioEl.addEventListener('timeupdate', () => {
  if(!usingRealAudio || !state.track) return;
  state.progress = audioEl.currentTime || 0;
  renderProgress();
  if(state.fullscreen) renderLyrics();
});
audioEl.addEventListener('loadedmetadata', () => {
  if(!usingRealAudio || !state.track || !isFinite(audioEl.duration) || audioEl.duration <= 0) return;
  const t = state.track;
  t.sec = Math.floor(audioEl.duration);
  t.duration = LIB.fmt(t.sec);
  $('#fsDur').textContent = t.duration;
  $('#seekRange').max = t.sec;
  renderProgress();
  if(state.view === 'detail') renderView();   // 详情表里的时长同步刷新
});
audioEl.addEventListener('ended', () => { if(usingRealAudio) nextTrack(true); });
audioEl.addEventListener('error', () => {
  if(usingRealAudio) toast('音频加载失败，请检查 file 路径 / 仓库是否公开 / 文件格式');
});

/* 键盘快捷键 */
document.addEventListener('keydown', (e) => {
  const typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if(e.key === 'Escape'){
    if(state.queueOpen) openQueue(false);
    else if(state.fullscreen) openFullscreen(false);
    else if(state.view === 'detail') setNav(state.nav);
    return;
  }
  if(typing) return;
  if(e.key === ' '){ e.preventDefault(); togglePlay(); }
  if(e.key === '/'){ e.preventDefault(); $('#searchInput').focus(); }
  if(e.key === 'ArrowRight' || e.key === 'ArrowLeft'){
    const d = e.key === 'ArrowRight' ? 5 : -5;
    const dur = usingRealAudio && isFinite(audioEl.duration) ? audioEl.duration : (state.track.sec || 1);
    state.progress = Math.min(dur, Math.max(0, state.progress + d));
    if(usingRealAudio) audioEl.currentTime = state.progress;
    renderProgress();
    if(state.fullscreen) renderLyrics();
  }
});

window.addEventListener('resize', () => { if(state.fullscreen) renderLyrics(true); });

/* ==========================================================================
   16 / 数据接入 & 初始化
   --------------------------------------------------------------------------
   策略：首屏只放空容器 → 异步读取真实曲库（清单文件 → GitHub API）→
        成功后由 renderAlbums() 动态渲染；失败显示配置指引空状态。
        全程没有任何内置假专辑，也不会静默回退到演示数据。
   ========================================================================== */

/* 用真实曲库整体替换 LIB，重绘侧栏 / 网格 / 详情 / 播放栏 / 全屏页 */
function applyLibrary(internal, source, meta){
  LIB = {
    albums: internal.albums,
    tracklists: internal.tracklists,
    lyricSets: [],
    fmt,
    source,
  };
  LIB_ERROR = null;
  LIB_SOURCE = source;
  seedStateFromLibrary();

  state.search = ''; $('#searchInput').value = '';
  state.albumId = null;
  state.recent = [];
  state.lyricSet = null;
  state.lyricOffset = 0;
  state.lyricMeta = null;
  state.embeddedLyrics = null;
  id3Token++; lyricToken++;            // 让在途的 ID3 / LRC 请求结果失效
  state.view = 'albums'; state.nav = 'albums';
  $$('.nav-item').forEach(b => b.classList.toggle('is-active', b.dataset.nav === 'albums'));
  usingRealAudio = false;
  audioEl.pause();
  audioEl.removeAttribute('src');
  clearInterval(timer);

  if(!state.track){
    $('#playerTitle').textContent = '暂无歌曲';
    $('#playerArtist').textContent = LIB.albums.length + ' 张专辑';
    $('#playerCover').innerHTML = '';
  }

  renderAlbumNav();
  renderView();
  renderPlayer();
  renderFullscreen();
  renderProgress();
  renderQueue();
  updateSourceChip(source, meta.reason || '');
  initFromURL();
  startTimer();
  toast(`曲库已同步 · ${LIB.albums.length} 张专辑 · ${source === 'github' ? 'GitHub API' : '清单文件'}${meta.fromCache ? '（缓存）' : ''}`);
}

/* 异步加载入口：永不 reject；失败显示明确的排查指引，绝不回退假数据 */
async function bootLibrary(force){
  const DS = window.MusicDataSource;
  const btn = $('#refreshBtn');
  if(!DS) return;
  updateSourceChip(LIB_SOURCE, '', true);
  if(btn) btn.classList.add('is-spin');
  try{
    if(force) DS.clearCache();
    const r = await DS.load({ force: !!force });
    if(r.ok && r.internal && r.internal.albums.length){
      applyLibrary(r.internal, r.source, r);
    } else {
      LIB_ERROR = r;
      LIB_SOURCE = 'empty';
      updateSourceChip('empty', r.reason || '');
      renderView();
      if(force) toast('同步未成功：' + (r.reason || '未知原因'));
    }
  }catch(err){
    LIB_ERROR = { reason:String(err && err.message || err), reasons:[] };
    LIB_SOURCE = 'empty';
    updateSourceChip('empty', LIB_ERROR.reason);
    renderView();
    if(force) toast('同步出错：' + LIB_ERROR.reason);
  }finally{
    if(btn) btn.classList.remove('is-spin');
  }
}

/* 首屏：只显示空容器 + 加载提示，绝不渲染任何假专辑 */
setTheme(state.theme);
renderAlbumNav();
updateSourceChip('loading', '正在读取真实曲库');
window.MusicDataSource.renderLoading($('#viewRoot'));
renderPlayer();
renderFullscreen();
renderProgress();
renderQueue();
startTimer();

/* 预览入口：?view=detail / ?view=fullscreen / ?view=artists
   另可叠加 ?source=github | list、?list=manifest.json、?refresh=1 */
function initFromURL(){
  const p = new URLSearchParams(location.search);
  const v = p.get('view');
  if(v === 'detail'){
    const want = p.get('album');
    state.albumId = (want && albumById(want)) ? want : (LIB.albums[0] && LIB.albums[0].id);
    state.view = 'detail';
    renderView(); renderAlbumNav();
  } else if(v === 'fullscreen'){
    openFullscreen(true);
  } else if(['favorites','recent','artists'].includes(v)){
    setNav(v);
  }
}
initFromURL();

bootLibrary(false);
</script>
