<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的音乐站</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1a202c;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .player-wrapper {
            display: flex;
            width: 800px;
            height: 500px;
            background: #1e293b;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            overflow: hidden;
        }
        .left-panel {
            width: 50%;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #2d3748 0%, #1a202c 100%);
        }
        .cover-img {
            width: 250px;
            height: 250px;
            border-radius: 12px;
            object-fit: cover;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }
        .song-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
            text-align: center;
        }
        .song-artist {
            font-size: 14px;
            color: #a0aec0;
            margin-bottom: 20px;
        }
        .progress-container {
            width: 100%;
            margin-bottom: 20px;
        }
        .progress-bar {
            width: 100%;
            height: 4px;
            background: #4a5568;
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }
        .progress-fill {
            height: 100%;
            background: #63b3ed;
            border-radius: 2px;
            width: 0%;
            transition: width 0.1s linear;
        }
        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #a0aec0;
            margin-top: 5px;
        }
        .controls {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .controls button {
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            transition: color 0.2s;
        }
        .controls button:hover {
            color: #63b3ed;
        }
        .controls .play-btn {
            font-size: 32px;
        }
        .right-panel {
            width: 50%;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #111827;
        }
        .lyrics-container {
            text-align: center;
            font-size: 16px;
            line-height: 2.5;
            color: #4a5568;
            overflow: hidden;
            position: relative;
            height: 300px;
        }
        .lyrics-line {
            transition: all 0.3s;
            opacity: 0.5;
        }
        .lyrics-line.active {
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            opacity: 1;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

<div class="player-wrapper">
    <div class="left-panel">
        <img id="cover-img" class="cover-img" src="https://cdn.jsdelivr.net/gh/1701-lz/music@main/audio/2004被禁忌的游戏/Cover.jpg" alt="Cover">
        <div id="song-title" class="song-title">请点击播放</div>
        <div id="song-artist" class="song-artist">未知歌手</div>
        
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="time-info">
                <span id="current-time">0:00</span>
                <span id="duration">0:00</span>
            </div>
        </div>

        <div class="controls">
            <button onclick="prevSong()">⏮</button>
            <button class="play-btn" id="play-btn" onclick="togglePlay()">▶</button>
            <button onclick="nextSong()">⏭</button>
        </div>
    </div>

    <div class="right-panel">
        <div class="lyrics-container" id="lyrics-container">
            <!-- 歌词会动态插入这里 -->
            <div class="lyrics-line">正在播放...</div>
        </div>
    </div>
</div>

<audio id="audio-player"></audio>

<script>
    // 你的歌单 (从这里开始修改)
    const songs = [
        {
            name: "黑色信封",
            artist: "2004 被禁忌的游戏",
            url: "https://cdn.jsdelivr.net/gh/1701-lz/music@main/audio/2004被禁忌的游戏/01.黑色信封.mp3",
            cover: "https://cdn.jsdelivr.net/gh/1701-lz/music@main/audio/2004被禁忌的游戏/Cover.jpg"
        },
        {
            name: "青春",
            artist: "2004 被禁忌的游戏",
            url: "https://cdn.jsdelivr.net/gh/1701-lz/music@main/audio/2004被禁忌的游戏/02.青春.mp3",
            cover: "https://cdn.jsdelivr.net/gh/1701-lz/music@main/audio/2004被禁忌的游戏/Cover.jpg"
        },
        {
            name: "阿兰",
            artist: "2004 被禁忌的游戏",
            url: "https://cdn.jsdelivr.net/gh/1701-lz/music@main/audio/2004被禁忌的游戏/03.阿兰.mp3",
            cover: "https://cdn.jsdelivr.net/gh/1701-lz/music@main/audio/2004被禁忌的游戏/Cover.jpg"
        },
        {
            name: "离婚",
            artist: "2004 被禁忌的游戏",
            url: "https://cdn.jsdelivr.net/gh/1701-lz/music@main/audio/2004被禁忌的游戏/04.离婚.mp3",
            cover: "https://cdn.jsdelivr.net/gh/1701-lz/music@main/audio/2004被禁忌的游戏/Cover.jpg"
        },
        {
            name: "欢愉",
            artist: "2004 被禁忌的游戏",
            url: "https://cdn.jsdelivr.net/gh/1701-lz/music@main/audio/2004被禁忌的游戏/05.欢愉.mp3",
            cover: "https://cdn.jsdelivr.net/gh/1701-lz/music@main/audio/2004被禁忌的游戏/Cover.jpg"
        },
        {
            name: "卡夫卡",
            artist: "2004 被禁忌的游戏",
            url: "https://cdn.jsdelivr.net/gh/1701-lz/music@main/audio/2004被禁忌的游戏/06.卡夫卡.mp3",
            cover: "https://cdn.jsdelivr.net/gh/1701-lz/music@main/audio/2004被禁忌的游戏/Cover.jpg"
        },
        {
            name: "被禁忌的游戏",
            artist: "2004 被禁忌的游戏",
            url: "https://cdn.jsdelivr.net/gh/1701-lz/music@main/audio/2004被禁忌的游戏/07.被禁忌的游戏.mp3",
            cover: "https://cdn.jsdelivr.net/gh/1701-lz/music@main/audio/2004被禁忌的游戏/Cover.jpg"
        },
        {
            name: "罗庄的冬天",
            artist: "2004 被禁忌的游戏",
            url: "https://cdn.jsdelivr.net/gh/1701-lz/music@main/audio/2004被禁忌的游戏/08.罗庄的冬天.mp3",
            cover: "https://cdn.jsdelivr.net/gh/1701-lz/music@main/audio/2004被禁忌的游戏/Cover.jpg"
        },
        {
            name: "红色气球",
            artist: "2004 被禁忌的游戏",
            url: "https://cdn.jsdelivr.net/gh/1701-lz/music@main/audio/2004被禁忌的游戏/09.红色气球.mp3",
            cover: "https://cdn.jsdelivr.net/gh/1701-lz/music@main/audio/2004被禁忌的游戏/Cover.jpg"
        }
    ];

    let currentIndex = 0;
    const audio = document.getElementById('audio-player');
    const playBtn = document.getElementById('play-btn');
    const progressFill = document.getElementById('progress-fill');
    const progressBar = document.getElementById('progress-bar');
    const currentTimeEl = document.getElementById('current-time');
    const durationEl = document.getElementById('duration');
    const songTitle = document.getElementById('song-title');
    const songArtist = document.getElementById('song-artist');
    const coverImg = document.getElementById('cover-img');

    // 模拟歌词数据 (如果你想要真实歌词，可以在歌曲对象里加 lyrics: "第一句歌词\n第二句歌词")
    const mockLyrics = ["爱情来了", "她穿过夜色来看望一个人", "那不是我 是我的兄弟", "她背对着我脱下淋湿的衣服"];

    function loadSong(index) {
        const song = songs[index];
        if (!song) return;
        
        audio.src = song.url;
        songTitle.textContent = song.name;
        songArtist.textContent = song.artist;
        coverImg.src = song.cover;
        
        // 更新歌词显示
        const lyricsContainer = document.getElementById('lyrics-container');
        lyricsContainer.innerHTML = mockLyrics.map((line, i) => 
            `<div class="lyrics-line ${i === 0 ? 'active' : ''}">${line}</div>`
        ).join('');
        
        // 重置进度条
        progressFill.style.width = '0%';
        currentTimeEl.textContent = '0:00';
        durationEl.textContent = '0:00';
    }

    function togglePlay() {
        if (audio.paused) {
            audio.play().catch(e => alert("播放失败，请检查网络或文件链接"));
            playBtn.textContent = '⏸';
        } else {
            audio.pause();
            playBtn.textContent = '▶';
        }
    }

    function nextSong() {
        currentIndex = (currentIndex + 1) % songs.length;
        loadSong(currentIndex);
        togglePlay();
    }

    function prevSong() {
        currentIndex = (currentIndex - 1 + songs.length) % songs.length;
        loadSong(currentIndex);
        togglePlay();
    }

    // 格式化时间
    function formatTime(seconds) {
        if (isNaN(seconds)) return '0:00';
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    // 监听音频事件
    audio.addEventListener('timeupdate', () => {
        const percent = (audio.currentTime / audio.duration) * 100;
        progressFill.style.width = `${percent}%`;
        currentTimeEl.textContent = formatTime(audio.currentTime);
    });

    audio.addEventListener('loadedmetadata', () => {
        durationEl.textContent = formatTime(audio.duration);
    });

    audio.addEventListener('ended', nextSong);

    // 点击进度条跳转
    progressBar.addEventListener('click', (e) => {
        const rect = progressBar.getBoundingClientRect();
        const percent = (e.clientX - rect.left) / rect.width;
        audio.currentTime = percent * audio.duration;
    });

    // 初始化
    loadSong(currentIndex);

    // 监听歌词动画(简易版)
    setInterval(() => {
        const lines = document.querySelectorAll('.lyrics-line');
        if(lines.length === 0) return;
        const currentIndex = Math.floor(audio.currentTime / 3) % lines.length;
        lines.forEach((line, i) => {
            line.classList.toggle('active', i === currentIndex);
        });
    }, 1000);

</script>
</body>
</html>
